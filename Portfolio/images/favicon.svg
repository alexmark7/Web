<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Alex's orbit logo</title>
  <!-- Dark square behind the letter and its orbit. -->
  <rect x="1" y="1" width="62" height="62" rx="10" fill="#05090d" stroke="#395363" stroke-width="2"/>
  <!-- Blue orbit behind the letter. -->
  <ellipse cx="32" cy="34" rx="28" ry="10" transform="rotate(-25 32 34)" fill="none" stroke="#58c9ed" stroke-width="3"/>
  <!-- Angular A, with a small opening in the middle. -->
  <path fill="#f1f5f7" fill-rule="evenodd" d="M15 48 27 16h10l12 32h-9l-3-9H27l-3 9Zm14.5-17h5L32 24Z"/>
  <!-- This part of the orbit passes in front of the A. -->
  <path d="M7 41c2 8 24 6 40-4" fill="none" stroke="#58c9ed" stroke-width="3" stroke-linecap="round"/>
  <!-- A bright star in the upper corner. -->
  <path d="m51 8 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" fill="#a8eaff"/>
</svg>
