<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title description">
  <title id="title">Pong, Space Defender, and Snake</title>
  <desc id="description">Three small arcade screens show Pong paddles and a ball, a spaceship defending against invaders, and a snake approaching an apple.</desc>
  <rect width="800" height="500" fill="#000000"/>
  <rect x="70" y="55" width="660" height="390" rx="16" fill="#101010" stroke="#aaa99f" stroke-width="2"/>
  <text x="400" y="95" fill="#e9e4d8" font-family="Courier New, monospace" font-size="22" letter-spacing="3" text-anchor="middle">BROWSER GAMES</text>

  <!-- Pong: two paddles, a ball, and a dotted centre line. -->
  <rect x="94" y="120" width="190" height="290" fill="#070707" stroke="#4b4b4b"/>
  <text x="189" y="154" fill="#e9e4d8" font-family="Courier New, monospace" font-size="18" text-anchor="middle">PONG</text>
  <path d="M189 180v194" stroke="#666666" stroke-width="2" stroke-dasharray="9 10"/>
  <rect x="115" y="224" width="9" height="62" fill="#e9e4d8"/>
  <rect x="254" y="271" width="9" height="62" fill="#e9e4d8"/>
  <circle cx="164" cy="260" r="7" fill="#5d87ee"/>
  <path d="M143 260h11" stroke="#5d87ee" stroke-width="2" opacity="0.7"/>

  <!-- Space Defender: pixel invaders above the player's ship. -->
  <rect x="305" y="120" width="190" height="290" fill="#070707" stroke="#4b4b4b"/>
  <text x="400" y="148" fill="#e9e4d8" font-family="Courier New, monospace" font-size="16" text-anchor="middle">SPACE DEFENDER</text>
  <g fill="#f18a2a">
    <path d="M338 205h8v-8h8v8h8v-8h8v8h8v17h-8v8h-8v-8h-8v8h-8v-8h-8z"/>
    <path d="M394 205h8v-8h8v8h8v-8h8v8h8v17h-8v8h-8v-8h-8v8h-8v-8h-8z"/>
    <path d="M450 205h8v-8h8v8h8v-8h8v8h8v17h-8v8h-8v-8h-8v8h-8v-8h-8z"/>
  </g>
  <circle cx="337" cy="280" r="2" fill="#aaa99f"/>
  <circle cx="470" cy="270" r="2" fill="#aaa99f"/>
  <rect x="397" y="278" width="6" height="26" fill="#e9e4d8"/>
  <path d="M394 324h12v12h25v12h-62v-12h25z" fill="#5d87ee"/>
  <path d="M335 374h130" stroke="#666666" stroke-width="2"/>

  <!-- Snake: a square-bodied snake moving towards an apple. -->
  <rect x="516" y="120" width="190" height="290" fill="#070707" stroke="#4b4b4b"/>
  <text x="611" y="154" fill="#e9e4d8" font-family="Courier New, monospace" font-size="18" text-anchor="middle">SNAKE</text>
  <circle cx="566" cy="206" r="11" fill="#e66c6c"/>
  <path d="M566 195v-8m0 3c5-5 10-4 13-3" fill="none" stroke="#77c98c" stroke-width="3"/>
  <path d="M552 349h76v-65h38" fill="none" stroke="#77c98c" stroke-width="18" stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="658" y="275" width="19" height="19" fill="#77c98c"/>
  <circle cx="669" cy="281" r="2" fill="#07150c"/>
</svg>
